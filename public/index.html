<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TunnelGuard | Login</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="page-login">
    <canvas id="tunnelCanvas"></canvas>
    <div class="backdrop-glow"></div>

    <main class="shell shell--compact">
      <section class="glass-panel panel-login">
        <div class="brand-block">
          <p class="eyebrow">Secure portal</p>
          <h1 class="brand brand--large">TunnelGuard</h1>
          <p class="tagline">Safe passage to your destination</p>
        </div>

        <div class="social-login-row">
          <button class="provider-btn" data-provider="google" type="button">Google</button>
          <button class="provider-btn" data-provider="facebook" type="button">Facebook</button>
          <button class="provider-btn" data-provider="instagram" type="button">Instagram</button>
          <button class="provider-btn" data-provider="linkedin" type="button">LinkedIn</button>
        </div>

        <form id="loginForm" class="form-stack">
          <div class="field-group">
            <label for="username">Username or Email</label>
            <input id="username" name="username" type="text" placeholder="Enter username or email" required />
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter password" required />
          </div>

          <div class="actions-row">
            <button type="submit" class="btn btn--primary">Login</button>
            <button type="button" class="btn btn--ghost" id="signupBtn">Sign Up</button>
          </div>
        </form>
      </section>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
